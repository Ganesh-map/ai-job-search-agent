name: Weekly AI Job Search

on:
  schedule:
    # Monday 07:00 IST is Monday 01:30 UTC.
    - cron: "30 1 * * 1"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'serper' }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      MAX_RESULTS: "30"
      MIN_RELEVANT_JOBS: "10"
      PRIMARY_LOOKBACK_DAYS: "6"
      FALLBACK_LOOKBACK_DAYS: "8"
      MAX_SEARCH_QUERIES: "45"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run job search agent
        run: python job_search_agent.py
